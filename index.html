<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#b89ae8">

  <meta
    name="description"
    content="A little Valentine question 💜"
  >

  <title>Will You Be My Valentine? 💜</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background -->
  <div class="background">
    <div class="gradient-orb orb-one"></div>
    <div class="gradient-orb orb-two"></div>
    <div class="gradient-orb orb-three"></div>
  </div>

  <!-- Floating hearts -->
  <div class="hearts" aria-hidden="true">
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
  </div>

  <!-- Main application -->
  <main class="app">

    <!-- QUESTION SCREEN -->
    <section class="card question-card" id="questionScreen">

      <div class="sparkle sparkle-one">✦</div>
      <div class="sparkle sparkle-two">✧</div>
      <div class="sparkle sparkle-three">✦</div>

      <!-- Cute character -->
      <div class="character-area">

        <div class="heart-glow"></div>

        <div class="character" aria-label="Cute Valentine character">

          <div class="ear left-ear"></div>
          <div class="ear right-ear"></div>

          <div class="head">

            <div class="hair"></div>

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

            <div class="blush left-blush"></div>
            <div class="blush right-blush"></div>

            <div class="nose"></div>

            <div class="mouth">
              ♡
            </div>

          </div>

          <div class="body">
            <div class="body-heart">♥</div>
          </div>

          <div class="arm left-arm"></div>
          <div class="arm right-arm"></div>

        </div>

        <div class="mini-heart heart-a">♥</div>
        <div class="mini-heart heart-b">♥</div>
        <div class="mini-heart heart-c">♥</div>

      </div>

      <p class="small-text">
        I have a tiny question...
      </p>

      <h1>
        Will you be<br>
        <span>my Valentine?</span>
        <span class="main-heart">♥</span>
      </h1>

      <p class="subtitle">
        Choose wisely... 👀
      </p>

      <div class="buttons" id="buttonArea">

        <button
          class="yes-button"
          id="yesButton"
          type="button"
        >
          Yes! ♥
        </button>

        <button
          class="no-button"
          id="noButton"
          type="button"
        >
          No 🥺
        </button>

      </div>

      <p class="tiny-note">
        made with a little bit of courage & lots of love
      </p>

    </section>


    <!-- SUCCESS SCREEN -->
    <section
      class="card success-card hidden"
      id="successScreen"
    >

      <div class="celebration-character">

        <div class="success-face">

          <div class="success-eye"></div>
          <div class="success-eye"></div>

          <div class="success-blush"></div>
          <div class="success-blush"></div>

          <div class="success-mouth">
            ♥
          </div>

        </div>

        <div class="success-body">
          ♥
        </div>

      </div>

      <div class="success-sparkles">
        ✦ ✧ ✦
      </div>

      <p class="small-text">
        YAY!!! 🥹
      </p>

      <h2>
        You said YES! 💜
      </h2>

      <p class="success-message">
        You just made my little heart<br>
        extremely happy. ♥
      </p>

      <div class="love-message">
        ✨ Best decision ever ✨
      </div>

      <button
        class="replay-button"
        id="replayButton"
        type="button"
      >
        ↻ Replay
      </button>

    </section>

  </main>

  <!-- Confetti container -->
  <div
    class="confetti-container"
    id="confettiContainer"
    aria-hidden="true"
  ></div>

  <script src="script.js"></script>

</body>
</html>
