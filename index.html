<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#c7a7ed">

  <meta
    name="description"
    content="A little Valentine question 💜"
  >

  <title>Will You Be My Valentine? 💜</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Lavender background -->
  <div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>


  <!-- Floating hearts -->
  <div class="floating-hearts" aria-hidden="true">
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
  </div>


  <!-- =====================================
       QUESTION SCREEN
  ====================================== -->

  <main id="questionScreen" class="screen">

    <div class="card">

      <!-- Decorative sparkles -->
      <div class="sparkle s1">✦</div>
      <div class="sparkle s2">✧</div>
      <div class="sparkle s3">✦</div>


      <!-- DUDU -->
      <div class="single-character">

        <div class="character-glow"></div>

        <img
          src="dudu.jpeg"
          alt="Dudu holding a flower bouquet"
          class="dudu-main"
        >

      </div>


      <!-- Question -->
      <p class="eyebrow">
        I have something to ask you...
      </p>

      <h1>
        Will you be<br>
        <span>my Valentine?</span>
        <b>♥</b>
      </h1>

      <p
        id="questionMessage"
        class="message"
      >
        Choose wisely... 👀💜
      </p>


      <!-- Buttons -->
      <div class="buttons">

        <button
          id="yesButton"
          class="yes-button"
          type="button"
        >
          Yes! 💜
        </button>

        <button
          id="noButton"
          class="no-button"
          type="button"
        >
          No 🥺
        </button>

      </div>


      <p class="footer-text">
        made with a little courage & lots of love ♡
      </p>

    </div>

  </main>


  <!-- =====================================
       LOVE / BOUQUET ANIMATION SCREEN
  ====================================== -->

  <main
    id="loveScreen"
    class="screen animation-screen hidden"
  >

    <div class="love-card">


      <!-- Animation scene -->
      <div class="scene">


        <!-- DUDU -->
        <div class="person dudu">

          <img
            src="dudu.jpeg"
            alt="Dudu"
          >

          <div class="name-tag">
            Dudu 💜
          </div>

        </div>


        <!-- BUBU -->
        <div class="person bubu">

          <img
            src="bubu.jpeg"
            alt="Bubu"
          >

          <div class="name-tag">
            Bubu 💕
          </div>

        </div>


        <!-- Bouquet -->
        <div
          id="bouquet"
          class="bouquet"
          aria-hidden="true"
        >
          💐
        </div>

      </div>


      <!-- Animation text -->
      <div
        id="animationText"
        class="animation-text"
      >
        Dudu has something for Bubu... 🥺
      </div>


      <!-- Final message -->
      <div
        id="finalMessage"
        class="final-message hidden"
      >

        <div class="big-heart">
          ♥
        </div>

        <h2>
          YAY!!! 💜
        </h2>

        <p>
          Bubu said YES! 🥹
        </p>

        <span>
          Dudu &amp; Bubu forever ♡
        </span>

        <button
          id="replayButton"
          class="replay-button"
          type="button"
        >
          ↻ Replay
        </button>

      </div>

    </div>

  </main>


  <!-- Confetti -->
  <div
    id="confetti"
    class="confetti"
    aria-hidden="true"
  ></div>


  <!-- JavaScript -->
  <script>
document.addEventListener("DOMContentLoaded", function () {

  const yesButton = document.getElementById("yesButton");
  const noButton = document.getElementById("noButton");

  const questionScreen =
    document.getElementById("questionScreen");

  const loveScreen =
    document.getElementById("loveScreen");

  const questionMessage =
    document.getElementById("questionMessage");

  const bouquet =
    document.getElementById("bouquet");

  const animationText =
    document.getElementById("animationText");

  const finalMessage =
    document.getElementById("finalMessage");

  const replayButton =
    document.getElementById("replayButton");

  const confetti =
    document.getElementById("confetti");


  /* =========================
     NO BUTTON
  ========================= */

  const messages = [
    "No 🥺",
    "Are you sure? 🥺",
    "Please think about it... 💜",
    "Really? 😭",
    "Are you absolutely sure? 🥹",
    "Dudu is getting sad... 💔",
    "One more chance? 🌸",
    "Think again, please? 🥺",
    "Don't break Dudu's heart 😭",
    "Pretty please? 💜",
    "Last chance? 🥹",
    "Please say yes... 💐"
  ];

  let noCount = 0;


  noButton.addEventListener("click", function () {

    noCount++;

    const index =
      Math.min(noCount, messages.length - 1);

    noButton.textContent =
      messages[index];

    questionMessage.textContent =
      messages[index];

    const x =
      Math.random() * 60 - 30;

    const y =
      Math.random() * 40 - 20;

    noButton.style.transform =
      "translate(" + x + "px, " + y + "px)";
  });


  /* =========================
     YES BUTTON
  ========================= */

  yesButton.addEventListener("click", function () {

    questionScreen.classList.add("hidden");

    loveScreen.classList.remove("hidden");

    bouquet.classList.remove("give");

    finalMessage.classList.add("hidden");

    animationText.classList.remove("hidden");

    animationText.textContent =
      "Dudu has something for Bubu... 🥺";

    /*
      Restart animation.
    */
    void bouquet.offsetWidth;


    /*
      Start bouquet movement.
    */
    setTimeout(function () {

      animationText.textContent =
        "Dudu is giving Bubu a bouquet... 💐";

      bouquet.classList.add("give");

    }, 1200);


    /*
      Bouquet reaches Bubu.
    */
    setTimeout(function () {

      animationText.textContent =
        "Bubu got the flowers! 🥹💐";

    }, 3500);


    /*
      Celebration.
    */
    setTimeout(function () {

      animationText.classList.add("hidden");

      finalMessage.classList.remove("hidden");

      createConfetti();

    }, 4500);

  });


  /* =========================
     CONFETTI
  ========================= */

  function createConfetti() {

    confetti.innerHTML = "";

    const symbols = [
      "💜",
      "♥",
      "♡",
      "✦",
      "✧",
      "✨",
      "🌸",
      "💐"
    ];

    for (let i = 0; i < 80; i++) {

      const piece =
        document.createElement("span");

      piece.className =
        "confetti-piece";

      piece.textContent =
        symbols[
          Math.floor(
            Math.random() * symbols.length
          )
        ];

      piece.style.left =
        Math.random() * 100 + "%";

      piece.style.animationDuration =
        (2.5 + Math.random() * 3) + "s";

      piece.style.animationDelay =
        Math.random() * 1.5 + "s";

      piece.style.fontSize =
        (12 + Math.random() * 15) + "px";

      confetti.appendChild(piece);
    }

    setTimeout(function () {

      confetti.innerHTML = "";

    }, 7000);
  }


  /* =========================
     REPLAY
  ========================= */

  replayButton.addEventListener("click", function () {

    loveScreen.classList.add("hidden");

    questionScreen.classList.remove("hidden");

    noCount = 0;

    noButton.textContent = "No 🥺";

    noButton.style.transform =
      "translate(0, 0)";

    questionMessage.textContent =
      "Choose wisely... 👀💜";

    bouquet.classList.remove("give");

    finalMessage.classList.add("hidden");

    animationText.classList.remove("hidden");

    animationText.textContent =
      "Dudu has something for Bubu... 🥺";

  });

});
</script>
  

</body>

</html>
