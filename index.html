<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#c7a7ed">

  <title>Will You Be My Valentine? 💜</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Lavender background -->
  <div class="background">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <!-- Floating hearts -->
  <div class="floating-hearts">
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
  </div>


  <!-- =================================
       QUESTION SCREEN
  ================================== -->

  <main id="questionScreen" class="screen">

    <div class="card">

      <div class="sparkle s1">✦</div>
      <div class="sparkle s2">✧</div>
      <div class="sparkle s3">✦</div>

      <!-- Dudu -->
      <div class="single-character">

        <div class="character-glow"></div>

        <img
          src="dudu.jpg"
          alt="Dudu holding flowers"
          class="dudu-main"
        >

      </div>


      <p class="eyebrow">
        I have something to ask you...
      </p>

      <h1>
        Will you be<br>
        <span>my Valentine?</span>
        <b>♥</b>
      </h1>

      <p id="questionMessage" class="message">
        Choose wisely... 👀💜
      </p>


      <div class="buttons">

        <button
          id="yesButton"
          class="yes-button"
        >
          Yes! 💜
        </button>

        <button
          id="noButton"
          class="no-button"
        >
          No 🥺
        </button>

      </div>

      <p class="footer-text">
        made with a little courage & lots of love ♡
      </p>

    </div>

  </main>


  <!-- =================================
       LOVE ANIMATION SCREEN
  ================================== -->

  <main
    id="loveScreen"
    class="screen animation-screen hidden"
  >

    <div class="love-card">

      <div class="scene">

        <!-- DUDU -->
        <div class="person dudu">

          <img
            src="dudu.jpg"
            alt="Dudu"
          >

          <div class="name-tag">
            Dudu 💜
          </div>

        </div>


        <!-- BUBU -->
        <div class="person bubu">

          <img
            src="bubu.png"
            alt="Bubu"
          >

          <div class="name-tag">
            Bubu 💕
          </div>

        </div>


        <!-- Bouquet -->
        <div
          id="bouquet"
          class="bouquet"
        >
          💐
        </div>

      </div>


      <div
        id="animationText"
        class="animation-text"
      >
        Dudu has something for Bubu... 🥺
      </div>

      <div
        id="finalMessage"
        class="final-message hidden"
      >

        <div class="big-heart">
          ♥
        </div>

        <h2>
          YAY!!! 💜
        </h2>

        <p>
          Bubu said YES! 🥹
        </p>

        <span>
          Dudu & Bubu forever ♡
        </span>

        <button
          id="replayButton"
          class="replay-button"
        >
          ↻ Replay
        </button>

      </div>

    </div>

  </main>


  <!-- Confetti -->
  <div
    id="confetti"
    class="confetti"
  ></div>


  <script src="script.js"></script>

</body>

</html>
